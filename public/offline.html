<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0E11" />
    <title>Bot P2P — Sin conexión</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0e11;
        color: #eaecef;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #181a20;
        border: 1px solid #2b3139;
        border-radius: 20px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 800;
        color: #eaecef;
      }
      p {
        margin: 0 0 22px;
        font-size: 13px;
        line-height: 1.55;
        color: #848e9c;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        background: #fcd535;
        color: #0b0e11;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        src="/icons/icon-192x192.png"
        alt="Bot P2P"
        class="logo"
        width="56"
        height="56"
      />
      <h1>Sin conexión a internet</h1>
      <p>
        Bot P2P necesita conexión activa para consultar las brechas en vivo de
        Binance C2C y tus órdenes en tiempo real. Verifica tus datos o Wi-Fi y
        vuelve a intentarlo.
      </p>
      <button type="button" onclick="window.location.reload()">
        Reintentar conexión
      </button>
    </main>
  </body>
</html>
